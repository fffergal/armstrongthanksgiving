name: CI

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number to test
        required: false
        type: string
      head_sha:
        description: Pull request head SHA for the required check
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read

jobs:
  test:
    name: Run trusted CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Start required pull-request check
        id: required_check
        if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.head_sha != '')
        uses: actions/github-script@v7
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        with:
          script: |
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CI / test',
              head_sha: process.env.PR_HEAD_SHA,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: 'Trusted CI is running',
                summary: 'Testing the pull request merge ref with the workflow definition from main.',
              },
            });
            core.setOutput('check_id', data.id);

      - name: Check out source
        uses: actions/checkout@v5
        with:
          # The workflow comes from trusted main; only the source under test
          # comes from the pull request's merge ref.
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit

      - name: Start WordPress
        run: npm run wp:start

      - name: Seed WordPress fixtures
        run: npm run wp:setup

      - name: Run browser and Lighthouse tests
        run: npm run test:all

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            lighthouse-results/

      - name: Stop WordPress
        if: always()
        run: npm run wp:cleanup

      - name: Complete required pull-request check
        if: always() && steps.required_check.outputs.check_id != ''
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ steps.required_check.outputs.check_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const conclusion = {
              success: 'success',
              failure: 'failure',
              cancelled: 'cancelled',
            }[process.env.JOB_STATUS] || 'failure';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: `Trusted CI ${conclusion}`,
                summary: `The trusted CI runner completed with conclusion: ${conclusion}.`,
              },
            });
