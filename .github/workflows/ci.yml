name: Base-branch CI

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test
        required: false
        type: string
      head_sha:
        description: Expected current pull request head SHA
        required: false
        type: string

concurrency:
  # Keep the existing key stable when the workflow's display name changes.
  group: ci-CI-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  # Let main pushes finish any deployment in progress; the deploy baseline
  # accounts for newer pending pushes replacing one another.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  prepare_check:
    name: Prepare base-branch check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: read
    outputs:
      check_id: ${{ steps.context.outputs.check_id }}
      test_sha: ${{ steps.context.outputs.test_sha }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      run_tests: ${{ steps.context.outputs.run_tests }}
    steps:
      - name: Check out base-branch change-scope helper
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Test CI change-scope helper
        run: node --test tests/ci-change-scope.test.cjs

      - name: Determine push change scope
        id: push-change-scope
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/ci-change-scope.cjs "$BEFORE_SHA" "$AFTER_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify pull request and create check
        id: context
        uses: actions/github-script@v7
        env:
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          PUSH_RUN_TESTS: ${{ steps.push-change-scope.outputs.run_tests }}
        with:
          script: |
            const { isDocsOnlyPullRequestFiles } = require('./scripts/ci-change-scope.cjs');
            core.setOutput('run_tests', process.env.PUSH_RUN_TESTS || 'true');
            const requestedNumber = Number(process.env.INPUT_PR_NUMBER || 0);
            const prNumber = context.payload.pull_request?.number || requestedNumber;

            if (!prNumber) {
              core.setOutput('test_sha', '');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pullRequest.base.ref !== 'main' || pullRequest.state !== 'open') {
              core.setFailed('The requested pull request must be open and target main.');
              return;
            }

            if (context.eventName === 'workflow_dispatch' && pullRequest.head.sha !== process.env.INPUT_HEAD_SHA) {
              core.setFailed('The requested pull request head changed before base-branch CI started.');
              return;
            }

            const headSha = pullRequest.head.sha;
            const testSha = pullRequest.merge_commit_sha;
            if (!testSha) {
              core.setFailed('GitHub has not produced a merge commit for this pull request yet.');
              return;
            }
            const { data: mergeCommit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: testSha,
            });
            const parents = mergeCommit.parents.map(parent => parent.sha);
            if (mergeCommit.sha !== testSha
              || parents.length !== 2
              || parents[0] !== pullRequest.base.sha
              || parents[1] !== headSha) {
              core.setFailed('The pull-request merge commit does not match the captured base and head SHAs.');
              return;
            }
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });
            const docsOnly = isDocsOnlyPullRequestFiles(changedFiles, pullRequest.changed_files);

            if (docsOnly) {
              const now = new Date().toISOString();
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'CI / test',
                head_sha: headSha,
                status: 'completed',
                conclusion: 'success',
                started_at: now,
                completed_at: now,
                details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                output: {
                  title: 'Docs-only change; long CI skipped',
                  summary: 'All changed files are under docs/ or are Markdown files. Browser and Lighthouse tests were skipped.',
                },
              });
              core.setOutput('test_sha', testSha);
              core.setOutput('head_sha', headSha);
              core.setOutput('run_tests', 'false');
              return;
            }

            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CI / test',
              head_sha: headSha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: 'Base-branch CI is running',
                summary: 'Testing the immutable pull-request merge commit with the workflow definition from main.',
              },
            });

            core.setOutput('check_id', check.id);
            core.setOutput('test_sha', testSha);
            core.setOutput('head_sha', headSha);

  build_playwright_image:
    name: Build Linux Playwright image
    needs: prepare_check
    if: needs.prepare_check.result == 'success' && needs.prepare_check.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare_check.outputs.test_sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Configure Playwright image cache
        env:
          CACHE_TO: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=playwright-image,mode=max' || '' }}
        run: |
          echo 'PLAYWRIGHT_DOCKER_CACHE_FROM=type=gha,scope=playwright-image' >> "$GITHUB_ENV"
          if [ -n "$CACHE_TO" ]; then
            echo "PLAYWRIGHT_DOCKER_CACHE_TO=$CACHE_TO" >> "$GITHUB_ENV"
          fi

      - name: Build Linux Playwright image
        id: image
        run: |
          playwright_version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          dockerfile_key="$(sha256sum scripts/playwright.Dockerfile | cut -c1-8)"
          image="armstrong-thanksgiving-playwright:ubuntu-24.04-node-22.23.2-pw-${playwright_version}-${dockerfile_key}"
          args=(buildx build --load --platform=linux/amd64)
          args+=(--build-arg NODE_VERSION=22.23.2)
          args+=(--build-arg "PLAYWRIGHT_VERSION=$playwright_version")
          args+=(--tag "$image" --file scripts/playwright.Dockerfile)
          args+=(--cache-from "$PLAYWRIGHT_DOCKER_CACHE_FROM")
          if [ -n "${PLAYWRIGHT_DOCKER_CACHE_TO:-}" ]; then
            args+=(--cache-to "$PLAYWRIGHT_DOCKER_CACHE_TO")
          fi
          docker "${args[@]}" scripts
          echo "tag=$image" >> "$GITHUB_OUTPUT"

      - name: Package Playwright image for test job
        run: docker save '${{ steps.image.outputs.tag }}' | gzip -1 > "$RUNNER_TEMP/playwright-image.tar.gz"

      - name: Upload Playwright image
        uses: actions/upload-artifact@v6
        with:
          name: playwright-image-${{ github.run_id }}
          path: ${{ runner.temp }}/playwright-image.tar.gz
          compression-level: 0
          retention-days: 1

  test:
    name: Run base-branch CI
    needs: [prepare_check, build_playwright_image]
    if: >-
      always() &&
      needs.prepare_check.result == 'success' &&
      (needs.build_playwright_image.result == 'success' ||
      (github.event_name == 'push' && needs.prepare_check.outputs.run_tests == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      run_tests: ${{ steps.change-scope.outputs.run_tests }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # This workflow comes from the base branch; only the source under
          # test comes from the verified immutable pull-request merge commit.
          ref: ${{ needs.prepare_check.outputs.test_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check whether the push changes only documentation
        id: change-scope
        run: |
          echo "run_tests=${{ needs.prepare_check.outputs.run_tests }}" >> "$GITHUB_OUTPUT"
          if grep -Fqx 'run_tests=false' "$GITHUB_OUTPUT"; then
            echo 'Docs-only change; browser and Lighthouse tests are skipped.'
          fi

      - name: Install dependencies
        if: steps.change-scope.outputs.run_tests == 'true'
        run: npm ci

      - name: Start WordPress and install Playwright browsers
        if: steps.change-scope.outputs.run_tests == 'true'
        shell: bash
        run: |
          wp_log="$RUNNER_TEMP/wordpress-start.log"
          started_at=$(date +%s)
          npm run wp:start > "$wp_log" 2>&1 &
          wp_pid=$!

          if npx playwright install --with-deps chromium webkit; then
            browser_status=0
          else
            browser_status=$?
          fi

          if wait "$wp_pid"; then
            wp_status=0
          else
            wp_status=$?
          fi
          cat "$wp_log"
          echo "WordPress startup and browser installation completed in $(( $(date +%s) - started_at )) seconds."

          if [ "$browser_status" -ne 0 ]; then exit "$browser_status"; fi
          exit "$wp_status"

      - name: Seed WordPress fixtures
        if: steps.change-scope.outputs.run_tests == 'true'
        run: npm run wp:setup

      - name: Download Playwright image
        if: steps.change-scope.outputs.run_tests == 'true'
        uses: actions/download-artifact@v6
        with:
          name: playwright-image-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Load Playwright image
        if: steps.change-scope.outputs.run_tests == 'true'
        run: gzip -dc "$RUNNER_TEMP/playwright-image.tar.gz" | docker load

      - name: Run browser and Lighthouse tests
        id: browser-tests
        if: steps.change-scope.outputs.run_tests == 'true'
        run: npm run test:all

      - name: Upload browser reports
        if: always() && steps.change-scope.outputs.run_tests == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            lighthouse-results/

      - name: Stop WordPress
        if: always() && steps.change-scope.outputs.run_tests == 'true'
        run: npm run wp:cleanup

  complete_check:
    name: Complete required check
    needs: [prepare_check, test]
    if: always() && needs.prepare_check.outputs.check_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Complete required pull-request check
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ needs.prepare_check.outputs.check_id }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const conclusion = {
              success: 'success',
              failure: 'failure',
              cancelled: 'cancelled',
            }[process.env.TEST_RESULT] || 'failure';

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: `Base-branch CI ${conclusion}`,
                summary: `The base-branch CI runner completed with conclusion: ${conclusion}.`,
              },
            });

  deploy_production:
    name: Deploy production after CI
    needs: test
    # Always check the deploy baseline after a successful main push. Skipping
    # this reusable workflow for docs-only pushes could advance the successful
    # CI baseline past production changes from a failed deployment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success'
    uses: ./.github/workflows/deploy-production.yml
    permissions:
      actions: read
      contents: read
    with:
      before_sha: ${{ github.event.before }}
      after_sha: ${{ github.sha }}
    secrets: inherit
