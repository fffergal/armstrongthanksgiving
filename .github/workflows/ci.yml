name: CI

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: CI / test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # The workflow comes from trusted main; only the source under test
          # comes from the pull request's merge ref.
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit

      - name: Start WordPress
        run: npm run wp:start

      - name: Seed WordPress fixtures
        run: npm run wp:setup

      - name: Run browser and Lighthouse tests
        run: npm run test:all

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            lighthouse-results/

      - name: Stop WordPress
        if: always()
        run: npm run wp:cleanup
