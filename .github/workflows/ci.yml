name: CI

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test
        required: false
        type: string
      head_sha:
        description: Expected current pull request head SHA
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare_check:
    name: Prepare trusted check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      pull-requests: read
    outputs:
      check_id: ${{ steps.context.outputs.check_id }}
      merge_ref: ${{ steps.context.outputs.merge_ref }}
      head_sha: ${{ steps.context.outputs.head_sha }}
    steps:
      - name: Verify pull request and create check
        id: context
        uses: actions/github-script@v7
        env:
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const requestedNumber = Number(process.env.INPUT_PR_NUMBER || 0);
            const prNumber = context.payload.pull_request?.number || requestedNumber;

            if (!prNumber) {
              core.setOutput('merge_ref', '');
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pullRequest.base.ref !== 'main' || pullRequest.state !== 'open') {
              core.setFailed('The requested pull request must be open and target main.');
              return;
            }

            if (context.eventName === 'workflow_dispatch' && pullRequest.head.sha !== process.env.INPUT_HEAD_SHA) {
              core.setFailed('The requested pull request head changed before trusted CI started.');
              return;
            }

            const headSha = pullRequest.head.sha;
            const mergeRef = `refs/pull/${prNumber}/merge`;
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CI / test',
              head_sha: headSha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: 'Trusted CI is running',
                summary: 'Testing the pull request merge ref with the workflow definition from main.',
              },
            });

            core.setOutput('check_id', check.id);
            core.setOutput('merge_ref', mergeRef);
            core.setOutput('head_sha', headSha);

  test:
    name: Run trusted CI
    needs: prepare_check
    if: needs.prepare_check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          # This workflow comes from trusted main; only the source under test
          # comes from the verified pull request merge ref.
          ref: ${{ needs.prepare_check.outputs.merge_ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium webkit

      - name: Start WordPress
        run: npm run wp:start

      - name: Seed WordPress fixtures
        run: npm run wp:setup

      - name: Run browser and Lighthouse tests
        run: npm run test:all

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            lighthouse-results/

      - name: Stop WordPress
        if: always()
        run: npm run wp:cleanup

  complete_check:
    name: Complete required check
    needs: [prepare_check, test]
    if: always() && needs.prepare_check.outputs.check_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Complete required pull-request check
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ needs.prepare_check.outputs.check_id }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const conclusion = {
              success: 'success',
              failure: 'failure',
              cancelled: 'cancelled',
            }[process.env.TEST_RESULT] || 'failure';

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: `Trusted CI ${conclusion}`,
                summary: `The trusted CI runner completed with conclusion: ${conclusion}.`,
              },
            });
