name: Copilot review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted, dismissed, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
      head_sha:
        description: Pull request head commit to check
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    name: Request Copilot review
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot as reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! response="$(gh api --method POST "repos/$REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" -f 'reviewers[]=copilot-pull-request-reviewer' 2>&1)"; then
            if printf '%s' "$response" | grep -Eqi 'already|reviewer.*requested'; then
              echo 'Copilot is already requested; continuing.'
            else
              printf '%s\n' "$response"
              exit 1
            fi
          fi

  copilot-approval:
    name: Copilot approval
    if: github.event_name == 'pull_request_review' || github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require an approval for the current commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          latest_review="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]") | [.commit_id, .state, .submitted_at] | @tsv' | sort -k3,3 | tail -n 1)"
          IFS=$'\t' read -r reviewed_sha review_state submitted_at <<< "$latest_review"
          if [ "$reviewed_sha" != "$HEAD_SHA" ] || [ "$review_state" != 'APPROVED' ]; then
            echo "Copilot has not approved the current pull request commit (latest: ${review_state:-none})."
            exit 1
          fi
          echo "Copilot approved $HEAD_SHA."
