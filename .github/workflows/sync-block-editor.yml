name: Sync block editor content

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-block-editor
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Pull production Home page and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Select the reusable sync branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch='automation/sync-block-editor'
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

          if git fetch origin "$branch"; then
            git switch --create "$branch" --track "origin/$branch"
          else
            git switch --create "$branch"
          fi

      - name: Pull the published Home page
        run: npm run sync:block-editor -- pull

      - name: Update the sync branch when content changed
        id: diff
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          if git diff --quiet -- content/pages/home.html; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Production Home page already matches main.'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/pages/home.html
          git commit -m 'Sync Home page from block editor'
          git push --set-upstream origin "$BRANCH"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          EXISTING_PR_NUMBER: ${{ steps.branch.outputs.pr_number }}
        run: |
          pr_number="$EXISTING_PR_NUMBER"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'Sync Home page from block editor' \
              --body $'This PR was created by the **Sync block editor content** workflow.\n\nIt imports the published WordPress Home page into `content/pages/home.html`. CI and the normal Copilot approval gate still apply.')"
            pr_number="$(gh pr view "$pr_url" --json number --jq .number)"
          else
            echo "Updating existing sync PR #$pr_number."
          fi
          head_sha="$(git rev-parse HEAD)"
          # GITHUB_TOKEN-created pushes/PRs do not reliably emit a new
          # pull_request workflow run. Dispatch both required checks against
          # the sync branch so branch protection sees them on this commit.
          gh workflow run ci.yml --ref "$BRANCH" -f "ref=$BRANCH"
          gh workflow run copilot-review.yml --ref "$BRANCH" -f "pr_number=$pr_number" -f "head_sha=$head_sha"
